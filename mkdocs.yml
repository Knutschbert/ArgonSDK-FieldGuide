site_name: Field Guide for ArgonSDK
repo_url: https://github.com/Knutschbert/ArgonSDK-FieldGuide
edit_uri: blob/main/docs/


theme:
    name: 'material'
    font:
      text: Volkhov
    logo: assets/images/branding/uwu.png
    favicon: assets/images/branding/uwu.png
    features:
      - navigation.instant
      - navigation.tracking
      - navigation.top
      - navigation.indexes
      - toc.follow
      - search.suggest
      - search.highlight
      - content.code.copy
      - content.action.edit
    palette:
      - scheme: slate
        primary: amber
        accent: blue
        toggle:
          icon: material/brightness-4
          name: Switch to light mode
      - scheme: default
        primary: amber
        accent: indigo
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode

# Extensions
markdown_extensions:
  - nl2br
  - footnotes
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  # - pymdownx.superfences
  - admonition
  - pymdownx.details
  # - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
    # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid    
  - toc:
      permalink: true

hooks:
  - hooks/ref_links.py

plugins:
  - awesome-pages
  - mermaid2
  - search
  - roamlinks
  - embed_file
  - callouts

extra_css:
  - javascripts/mermaid-center.css
  - javascripts/extra.css
  - javascripts/bue-render/render.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mathjax/tex-svg.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - javascripts/curve-explorer.js
  # BlueprintUE renderer (vendored, MIT) must load before the embed loader
  - javascripts/bue-render/render.js
  - javascripts/bue-embed.js
  # Second, independent search box for the C++/BP reference
  - javascripts/ref-search.js
