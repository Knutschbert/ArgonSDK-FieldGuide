name: ci
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          key: mkdocs-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            mkdocs-${{ github.ref }}-
            mkdocs-
          path: .cache
      - run: pip install -r requirements-mkdocs.txt
      - run: mkdocs gh-deploy --force
